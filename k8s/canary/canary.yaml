# Canary release: one Service fronts two Deployments. Traffic share follows the
# replica ratio (9 stable : 1 canary = ~10% canary). Promote by scaling the
# canary up / stable down; abort by scaling the canary to 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
  labels: { app: aceest-canary, track: stable }
spec:
  replicas: 9
  selector:
    matchLabels: { app: aceest-canary, track: stable }
  template:
    metadata:
      labels: { app: aceest-canary, track: stable }
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: DEPLOY_COLOR, value: stable }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels: { app: aceest-canary, track: canary }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aceest-canary, track: canary }
  template:
    metadata:
      labels: { app: aceest-canary, track: canary }
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: DEPLOY_COLOR, value: canary }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  type: NodePort
  selector: { app: aceest-canary }
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082
