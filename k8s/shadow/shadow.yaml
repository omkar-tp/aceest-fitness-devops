# Shadow deployment: an nginx proxy serves every request from the primary
# (v1.1.0) and mirrors a copy to the shadow release (v2.0.0). Shadow responses
# are discarded, so users are never affected while v2.0.0 sees live traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
  namespace: aceest
  labels: { app: aceest-shadow-demo, role: primary }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aceest-shadow-demo, role: primary }
  template:
    metadata:
      labels: { app: aceest-shadow-demo, role: primary }
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: DEPLOY_COLOR, value: primary }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
  labels: { app: aceest-shadow-demo, role: shadow }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aceest-shadow-demo, role: shadow }
  template:
    metadata:
      labels: { app: aceest-shadow-demo, role: shadow }
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: DEPLOY_COLOR, value: shadow }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  selector: { app: aceest-shadow-demo, role: primary }
  ports:
    - { port: 80, targetPort: 5000 }
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  selector: { app: aceest-shadow-demo, role: shadow }
  ports:
    - { port: 80, targetPort: 5000 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-shadow-proxy-conf
  namespace: aceest
data:
  default.conf: |
    upstream primary { server aceest-primary:80; }
    upstream shadow  { server aceest-shadow:80; }

    server {
      listen 80;

      location / {
        mirror /mirror;
        mirror_request_body on;
        proxy_pass http://primary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location = /mirror {
        internal;
        proxy_pass http://shadow$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Shadow-Traffic "true";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-proxy
  namespace: aceest
  labels: { app: aceest-shadow-proxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aceest-shadow-proxy }
  template:
    metadata:
      labels: { app: aceest-shadow-proxy }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: aceest-shadow-proxy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-entry
  namespace: aceest
spec:
  type: NodePort
  selector: { app: aceest-shadow-proxy }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
