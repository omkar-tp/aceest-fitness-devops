# Blue-green: two full environments run side by side. The "live" Service
# selects one slot; switching is an instant selector patch (and so is rollback).
#   kubectl -n aceest patch svc aceest-bluegreen -p '{"spec":{"selector":{"app":"aceest-bluegreen","slot":"green"}}}'
# The green slot can be smoke-tested via the aceest-green-preview Service first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels: { app: aceest-bluegreen, slot: blue }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aceest-bluegreen, slot: blue }
  template:
    metadata:
      labels: { app: aceest-bluegreen, slot: blue }
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: DEPLOY_COLOR, value: blue }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels: { app: aceest-bluegreen, slot: green }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aceest-bluegreen, slot: green }
  template:
    metadata:
      labels: { app: aceest-bluegreen, slot: green }
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: DEPLOY_COLOR, value: green }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest
spec:
  type: NodePort
  selector: { app: aceest-bluegreen, slot: blue }
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-green-preview
  namespace: aceest
spec:
  type: NodePort
  selector: { app: aceest-bluegreen, slot: green }
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30085
