jenkins:
  systemMessage: "ACEest Fitness CI/CD"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-creds"
              username: "${DOCKERHUB_USER:-local}"
              password: "${DOCKERHUB_TOKEN:-not-set}"
              description: "Docker Hub"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN:-not-set}"
              description: "SonarQube token"
          - file:
              scope: GLOBAL
              id: "kubeconfig"
              fileName: "kubeconfig"
              secretBytes: "${KUBECONFIG_B64:-e30=}"
              description: "Kubernetes kubeconfig"

unclassified:
  location:
    url: "http://localhost:8080/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

jobs:
  - script: >
      pipelineJob('aceest-fitness') {
        description('ACEest Fitness CI/CD pipeline (see Jenkinsfile)')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPO_URL:-https://github.com/omkar-tp/aceest-fitness-devops.git}') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
